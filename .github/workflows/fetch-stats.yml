name: Fetch stats

on:
  schedule:
    # Every 5 minutes — temporary, while the cadence is being observed closely.
    # 5 min is GitHub's shortest allowed interval, and the most likely to be
    # delayed or dropped under load. Switch to "0 */12 * * *" (08:00 and 20:00
    # Asia/Manila) once settled.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: fetch-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch stats snapshot
        run: node scripts/fetch-stats.mjs

      - name: Commit snapshot
        run: |
          if [ -z "$(git status --porcelain data/json)" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "Auto Committer"
          git config user.email "auto-committer@battlerapph.org"
          git add data/json
          git commit -m "chore(data): stats snapshot"
          git push
