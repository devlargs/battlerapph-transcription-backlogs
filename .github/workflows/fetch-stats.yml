name: Fetch stats

on:
  schedule:
    # Every 8 hours at 00:00, 08:00 and 16:00 UTC — 08:00, 16:00 and 00:00
    # Asia/Manila, the timezone the snapshots are stamped in. GitHub runs
    # scheduled workflows at low priority and may deliver them late.
    - cron: "0 */8 * * *"
  workflow_dispatch:

concurrency:
  group: fetch-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch stats snapshot
        run: node scripts/fetch-stats.mjs

      - name: Commit snapshot
        run: |
          if [ -z "$(git status --porcelain data/json)" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "Auto Committer"
          git config user.email "auto-committer@battlerapph.org"
          git add data/json
          git commit -m "chore(data): stats snapshot"
          git push
