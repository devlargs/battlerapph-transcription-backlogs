name: Deploy

on:
  # Snapshot commits are pushed with GITHUB_TOKEN, which by design cannot fire a
  # `push` trigger. workflow_run is the supported way to chain off them.
  workflow_run:
    workflows: ["Fetch stats"]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # For workflow_run, only build when the upstream run both succeeded and
    # actually committed data — a "No data changes." run leaves main untouched,
    # so its head_sha still matches HEAD and there is nothing new to publish.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_sha != github.sha)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
